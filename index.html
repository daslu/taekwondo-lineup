<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taekwondo lineup builder</title>

<!--
  Taekwondo lineup builder — right-origin convention.

  Single file, no build step, no dependencies. Open it in a browser.

  Structure:
    1. <style>            page chrome (CSS custom properties, light/dark)
    2. <body>             static markup; the belt controls are generated
    3. CONFIG              belts, defaults, geometry, palette  <- edit here first
    4. state / helpers
    5. buildSvg()          pure: state -> SVG string (this is the infographic)
    6. render()            SVG string -> DOM, plus the headcount readout
    7. controls            icons, slider wiring
    8. export              PNG download

  The SVG is built as a string rather than through the DOM so that the same
  function serves both the on-screen preview and the exported file. It uses
  no CSS variables and no external fonts, so the exported file is standalone.

  The interface carries no prose: each control is an icon or a belt colour
  plus a number. Meaning for screen readers lives in aria-label / title, so
  those are the labels to keep accurate when adding a control.
-->

<style>
  :root {
    --bg: #FAF9F5;
    --card: #FFFFFF;
    --ink: #23231F;
    --ink-2: #5F5E58;
    --ink-3: #8A8880;
    --line: #E3E0D8;
    --line-2: #CFCCC2;
    --accent: #6B4FA8;
    --danger: #A33;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1B19;
      --card: #252523;
      --ink: #EDEBE4;
      --ink-2: #B4B1A8;
      --ink-3: #86847D;
      --line: #3A3936;
      --line-2: #4C4B46;
      --accent: #A492DC;
      --danger: #F09595;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

  .cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .panel + .panel { margin-top: 12px; }

  /* Every control has the same shape: [icon or belt chip] [slider] [number]. */
  .field {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 24px;
    gap: 10px; align-items: center;
  }
  .field + .field { margin-top: 10px; }

  .fval { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }

  .ico { display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .ico svg, button svg { display: block; }

  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }

  .chip { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); }

  /* Rank order is shown by the order of the rows themselves; render() sets it. */
  #belts { display: flex; flex-direction: column; }

  .toggles { display: flex; gap: 8px; margin-top: 14px; }

  .icon-toggle { position: relative; display: block; cursor: pointer; }
  .icon-toggle input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
  .icon-toggle span {
    display: block; padding: 7px; color: var(--ink-3);
    border: 1px solid var(--line-2); border-radius: var(--radius);
  }
  .icon-toggle input:checked + span { color: #fff; background: var(--accent); border-color: var(--accent); }
  .icon-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  #stage { overflow: hidden; }
  #stage svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }

  .bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }

  button {
    font: inherit; display: flex; align-items: center; justify-content: center;
    padding: 9px 18px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--radius);
    cursor: pointer; touch-action: manipulation;
  }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .count { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--ink-2); }
  .count .ico { color: inherit; }
  .count.warn { color: var(--danger); }
  #status { font-size: 12px; font-variant-numeric: tabular-nums; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /*
    Phones: the app is sized to the viewport so every belt slider is on screen
    without scrolling. The controls keep their natural height and the preview
    takes what is left over, so the preview is what shrinks as belts are added.
  */
  @media (max-width: 860px) {
    .wrap {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 12px;
    }

    .cols { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .cols > div { flex: 0 0 auto; }        /* controls: natural height */

    .panel { padding: 8px 12px; }
    .panel + .panel { margin-top: 8px; }

    .cols > .panel {                       /* preview: soaks up the remainder */
      order: -1;
      flex: 1 1 0; min-height: 110px;
      display: flex; flex-direction: column;
      padding: 8px;
    }
    #stage { flex: 1 1 auto; min-height: 0; position: relative; }
    /* Absolute, so max-height resolves against a definite box: the drawing
       scales down to fit instead of pushing the controls off screen. */
    #stage svg {
      position: absolute; inset: 0; margin: auto;
      max-width: 100%; max-height: 100%; width: auto; height: auto;
    }

    .field + .field { margin-top: 6px; }
    .toggles { margin-top: 8px; }
    input[type=range] { height: 24px; }    /* larger touch target */
    .bar { margin-top: 8px; }
    button { padding: 7px 18px; }
  }
</style>
</head>

<body>
<div class="wrap">
  <h1 class="sr-only">Taekwondo lineup builder</h1>

  <div class="cols">
    <div>
      <section class="panel">
        <h2 class="sr-only">Floor</h2>
        <div class="field">
          <span class="ico" data-icon="rows"></span>
          <input type="range" id="rows" min="1" max="8" value="4" aria-label="Rows">
          <span class="fval" id="rowsVal"></span>
        </div>
        <div class="field">
          <span class="ico" data-icon="cols"></span>
          <input type="range" id="cols" min="1" max="10" value="4" aria-label="Columns">
          <span class="fval" id="colsVal"></span>
        </div>
        <div class="toggles">
          <label class="icon-toggle" title="Show position numbers">
            <input type="checkbox" id="showNums" checked aria-label="Show position numbers">
            <span data-icon="numbers"></span>
          </label>
          <label class="icon-toggle" title="Reverse rank order">
            <input type="checkbox" id="reverse" aria-label="Reverse rank order">
            <span data-icon="reverse"></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2 class="sr-only">Students per belt</h2>
        <div id="belts"></div>
      </section>
    </div>

    <section class="panel">
      <h2 class="sr-only">Lineup preview</h2>
      <div id="stage" role="img" aria-label="Overhead plan of the class lined up in rank order, most senior at the front right, each row filling right to left"></div>
      <div class="bar">
        <button id="pngBtn" class="primary" data-icon="download" aria-label="Download PNG" title="Download PNG"></button>
        <span class="count" id="count">
          <span class="ico" data-icon="people"></span><span id="status"></span>
        </span>
      </div>
    </section>
  </div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   1. CONFIG — everything you are likely to want to change lives here.
--------------------------------------------------------------------------- */

/*
  Belts in rank order, most senior first.
  `base`   fill colour of the circle
  `stripe` colour of the horizontal band, or null for a plain belt
  `ink`    colour of the position number drawn on top
*/
const BELTS = [
  { id: "green",  name: "Green",                base: "#2E7D4F", stripe: null,      ink: "#FFFFFF" },
  { id: "yg",     name: "Yellow, green stripe", base: "#F0C93C", stripe: "#2E7D4F", ink: "#3B3306" },
  { id: "yellow", name: "Yellow",               base: "#F0C93C", stripe: null,      ink: "#3B3306" },
  { id: "wy",     name: "White, yellow stripe", base: "#FCFBF7", stripe: "#F0C93C", ink: "#3A3A36" },
  { id: "white",  name: "White",                base: "#FCFBF7", stripe: null,      ink: "#3A3A36" },
  { id: "grey",   name: "Grey",                 base: "#777777", stripe: null,      ink: "#FFFFFF" },
  { id: "purple", name: "Purple",               base: "#6B4FA8", stripe: null,      ink: "#FFFFFF" },
];

const DEFAULT_COUNTS = { green: 3, yg: 1, yellow: 2, wy: 3, white: 3, grey: 2, purple: 2 };

const INSTRUCTOR = { name: "Instructor", base: "#191917", stripe: null, ink: "#FFFFFF" };

/* Geometry of the infographic, in SVG user units. */
const GEO = {
  radius: 24,          // circle radius
  cell: 68,            // grid pitch; cell - 2*radius is the gap between circles
  minWidth: 320,       // keeps a narrow grid from rendering as a sliver
  pad: 40,             // horizontal padding inside the mat
  stripeFraction: 0.34, // half-height of the stripe, as a fraction of the radius
};

/* Fixed palette for the exported image — deliberately does not follow the
   page theme, so a downloaded PNG looks the same for everyone. */
const PAPER = {
  mat: "#F7F5EF",
  matEdge: "#DAD6CB",
  ink: "#3A3934",
  inkMuted: "#6E6C64",
  ring: "#2C2B27",
};

const SVG_FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

/* Slider bounds. Grid bounds must match the `min`/`max` on the inputs. */
const LIMITS = { maxPerBelt: 20, maxRows: 8, maxCols: 10 };

const FILENAME = "taekwondo-lineup";

/* ---------------------------------------------------------------------------
   2. State
--------------------------------------------------------------------------- */

const state = {
  counts: { ...DEFAULT_COUNTS },
  rows: 4,
  cols: 4,
  showNumbers: true,
  reversed: false,
};

const $ = (id) => document.getElementById(id);
const el = {
  rows: $("rows"), cols: $("cols"),
  rowsVal: $("rowsVal"), colsVal: $("colsVal"),
  showNums: $("showNums"), reverse: $("reverse"),
  belts: $("belts"), stage: $("stage"),
  count: $("count"), status: $("status"), pngBtn: $("pngBtn"),
};

const escapeXml = (s) => String(s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* Belts in the order currently selected. */
const rankedBelts = () => state.reversed ? [...BELTS].reverse() : BELTS;

/* One entry per student, in rank order. */
function roster() {
  const out = [];
  for (const belt of rankedBelts()) {
    for (let i = 0; i < state.counts[belt.id]; i++) out.push(belt);
  }
  return out;
}

const headcount = () => Object.values(state.counts).reduce((a, b) => a + b, 0);

/*
  Choose the squarest grid that holds everyone, within the slider bounds.
  Called whenever a belt count changes; the row/column sliders remain
  editable afterwards, so a manual layout survives until the next change.
*/
function fitGrid() {
  const total = headcount();
  if (total < 1) return;
  let cols = Math.min(LIMITS.maxCols, Math.max(1, Math.ceil(Math.sqrt(total))));
  let rows = Math.min(LIMITS.maxRows, Math.max(1, Math.ceil(total / cols)));
  while (rows * cols < total && cols < LIMITS.maxCols) {
    cols++;
    rows = Math.min(LIMITS.maxRows, Math.ceil(total / cols));
  }
  state.cols = cols;
  state.rows = rows;
  el.cols.value = cols;
  el.rows.value = rows;
}

/*
  Right-origin seat order. Seat 0 is the front-right corner; each row runs
  right to left, then wraps to the right end of the row behind.
  Swap the `col` line for `col = fromEdge` to get the left-origin convention.
*/
function seatPosition(index, cols) {
  const row = Math.floor(index / cols);
  const fromEdge = index % cols;
  const col = cols - 1 - fromEdge;
  return { row, col };
}

/* ---------------------------------------------------------------------------
   3. buildSvg — pure function from state to an SVG string
--------------------------------------------------------------------------- */

/* One belt circle: fill, optional stripe band clipped to the circle,
   outline, and optional position number. */
function circleMarkup(key, cx, cy, r, spec, label) {
  const parts = [];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${spec.base}"/>`);

  if (spec.stripe) {
    const clipId = `clip-${key}`;
    const half = r * GEO.stripeFraction;
    parts.push(`<clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`);
    parts.push(
      `<rect x="${cx - r}" y="${cy - half}" width="${2 * r}" height="${2 * half}" ` +
      `fill="${spec.stripe}" clip-path="url(#${clipId})"/>`
    );
  }

  parts.push(
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ` +
    `stroke="${PAPER.ring}" stroke-width="1.25" stroke-opacity="0.55"/>`
  );

  if (label) {
    parts.push(
      `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" ` +
      `font-family="${SVG_FONT}" font-size="14" font-weight="500" fill="${spec.ink}">` +
      `${escapeXml(label)}</text>`
    );
  }
  return parts.join("");
}

function buildSvg() {
  const { radius: R, cell, pad } = GEO;
  const { rows, cols } = state;

  const students = roster();
  const capacity = rows * cols;
  const placed = students.slice(0, capacity);

  // --- layout -------------------------------------------------------------
  const gridWidth = cols * cell;
  const width = Math.max(gridWidth + pad * 2, GEO.minWidth);
  const gridLeft = (width - gridWidth) / 2;

  const instructorCy = 34 + R;
  const frontLineY = instructorCy + R + 30;
  const gridTop = frontLineY + 26;
  const height = gridTop + rows * cell + 24;

  // --- draw ---------------------------------------------------------------
  const svg = [];
  svg.push(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" ` +
    `viewBox="0 0 ${width} ${height}">`
  );
  svg.push(
    `<rect x="0" y="0" width="${width}" height="${height}" rx="14" ` +
    `fill="${PAPER.mat}" stroke="${PAPER.matEdge}" stroke-width="1"/>`
  );

  // Instructor, label, and the line marking the front of the room.
  svg.push(circleMarkup("instructor", width / 2, instructorCy, R, INSTRUCTOR, ""));
  svg.push(
    `<text x="${width / 2}" y="${instructorCy + R + 16}" text-anchor="middle" ` +
    `font-family="${SVG_FONT}" font-size="12" fill="${PAPER.inkMuted}">` +
    `${escapeXml(INSTRUCTOR.name)}</text>`
  );
  svg.push(
    `<line x1="${pad}" y1="${frontLineY}" x2="${width - pad}" y2="${frontLineY}" ` +
    `stroke="${PAPER.matEdge}" stroke-width="1" stroke-dasharray="5 4"/>`
  );

  // Students.
  placed.forEach((belt, i) => {
    const { row, col } = seatPosition(i, cols);
    const cx = gridLeft + col * cell + cell / 2;
    const cy = gridTop + row * cell + cell / 2;
    svg.push(circleMarkup(i, cx, cy, R, belt, state.showNumbers ? String(i + 1) : ""));
  });

  svg.push("</svg>");

  return { markup: svg.join(""), width, height, total: students.length, capacity };
}

/* ---------------------------------------------------------------------------
   4. Render
--------------------------------------------------------------------------- */

function render() {
  const result = buildSvg();
  el.stage.innerHTML = result.markup;

  el.rowsVal.textContent = state.rows;
  el.colsVal.textContent = state.cols;

  // The belt list is reordered rather than labelled: its top-to-bottom order
  // is the rank order, and so follows the "reverse" toggle.
  rankedBelts().forEach((belt, i) => {
    const row = el.belts.querySelector(`[data-belt="${belt.id}"]`);
    if (row) row.style.order = i;
  });

  // headcount / places, red when the floor cannot hold everyone.
  el.count.className = result.total > result.capacity ? "count warn" : "count";
  el.status.textContent = `${result.total} / ${result.capacity}`;
}

/* ---------------------------------------------------------------------------
   5. Controls
--------------------------------------------------------------------------- */

/*
  Inline 16px icons, stroked in currentColor so they follow the theme and the
  checked state of a toggle. Injected into every [data-icon] element.
*/
const ICONS = {
  rows: '<path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>',
  cols: '<path d="M4 2.5v11M8 2.5v11M12 2.5v11"/>',
  reverse: '<path d="M5 13.5V3M5 3L2.6 5.4M5 3l2.4 2.4M11 2.5V13M11 13l2.4-2.4M11 13l-2.4-2.4"/>',
  numbers: '<circle cx="8" cy="8" r="5.7"/><path d="M6.9 6.5L8.2 5.6v4.9M6.9 10.5h2.6"/>',
  people: '<circle cx="8" cy="5.2" r="2.5"/><path d="M3 13.6a5 5 0 0 1 10 0"/>',
  download: '<path d="M8 2.5v7.5M8 10l3-3M8 10L5 7M2.8 13h10.4"/>',
  check: '<path d="M3.2 8.4l3.4 3.4 6.2-7"/>',
  warn: '<path d="M8 2.6l6.2 10.8H1.8z"/><path d="M8 6.8v3M8 11.9v.4"/>',
};

const iconSvg = (name) =>
  `<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" ` +
  `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

function paintIcons(root) {
  root.querySelectorAll("[data-icon]").forEach((node) => {
    node.innerHTML = iconSvg(node.dataset.icon);
  });
}

/* Swap the download button's icon briefly to signal the outcome of a save. */
let flashTimer = null;
function flashIcon(name) {
  el.pngBtn.innerHTML = iconSvg(name);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.pngBtn.innerHTML = iconSvg("download"); }, 1600);
}

function buildBeltControls() {
  el.belts.innerHTML = "";

  for (const belt of BELTS) {
    const row = document.createElement("div");
    row.className = "field";
    row.dataset.belt = belt.id;
    row.title = belt.name;          // the colour is the label; this is the gloss

    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.background = belt.stripe
      ? `linear-gradient(${belt.base} 0 34%, ${belt.stripe} 34% 66%, ${belt.base} 66% 100%)`
      : belt.base;

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = String(LIMITS.maxPerBelt);
    slider.value = state.counts[belt.id];
    slider.setAttribute("aria-label", `${belt.name} count`);

    const valueOut = document.createElement("span");
    valueOut.className = "fval";
    valueOut.textContent = state.counts[belt.id];

    slider.addEventListener("input", () => {
      state.counts[belt.id] = Number(slider.value);
      valueOut.textContent = slider.value;
      fitGrid();
      render();
    });

    row.append(chip, slider, valueOut);
    el.belts.append(row);
  }
}

el.rows.addEventListener("input", () => { state.rows = Number(el.rows.value); render(); });
el.cols.addEventListener("input", () => { state.cols = Number(el.cols.value); render(); });
el.showNums.addEventListener("change", () => { state.showNumbers = el.showNums.checked; render(); });
el.reverse.addEventListener("change", () => { state.reversed = el.reverse.checked; render(); });

/* ---------------------------------------------------------------------------
   6. Export

   Two paths. Inside the Claude artifact runtime the file goes through
   claude.use("downloads"); everywhere else — a local file, your own site —
   it falls back to an object URL and a synthetic click.

   buildSvg() still backs this: the SVG is rasterised to PNG rather than
   offered as its own download.
--------------------------------------------------------------------------- */

let claudeDownloads = null;

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads")
    .then((api) => { claudeDownloads = api; })
    .catch(() => {});
}

function saveFile(filename, blob) {
  if (claudeDownloads) {
    claudeDownloads.save({ filename, data: blob })
      .then(() => flashIcon("check"))
      .catch((err) => {
        if (err && err.code === "declined") return;
        el.pngBtn.title = `Could not save: ${(err && err.code) || "unknown error"}`;
        flashIcon("warn");
      });
    return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flashIcon("check");
}

/* Rasterise by loading the SVG as a data URL into an <img>. The SVG has no
   external references, so the canvas stays untainted and toBlob works. */
el.pngBtn.addEventListener("click", () => {
  const { markup, width, height } = buildSvg();
  const scale = 2;

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = PAPER.mat;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      if (!blob) return flashIcon("warn");
      saveFile(`${FILENAME}.png`, blob);
    }, "image/png");
  };
  img.onerror = () => flashIcon("warn");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
});

/* ---------------------------------------------------------------------------
   7. Start
--------------------------------------------------------------------------- */

paintIcons(document);
buildBeltControls();
fitGrid();
render();
</script>
</body>
</html>
