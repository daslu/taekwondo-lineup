<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taekwondo lineup builder</title>

<!--
  Taekwondo lineup builder — right-origin convention.

  Single file, no build step, no dependencies. Open it in a browser.

  Structure:
    1. <style>            page chrome (CSS custom properties, light/dark)
    2. <body>             static markup; the belt controls are generated
    3. CONFIG              belts, defaults, geometry, palette  <- edit here first
    3b. STRINGS            en / de / ar; the only words in the product
    4. state / helpers
    5. buildSvg()          pure: state -> SVG string (this is the infographic)
    6. render()            SVG string -> DOM, plus the headcount readout
    7. controls            icons, slider wiring
    8. export              PNG download

  The SVG is built as a string rather than through the DOM so that the same
  function serves both the on-screen preview and the exported file. It uses
  no CSS variables and no external fonts, so the exported file is standalone.

  The interface carries no prose: each control is an icon or a belt colour
  plus a number. Meaning for screen readers lives in aria-label / title, so
  those are the labels to keep accurate when adding a control.
-->

<style>
  :root {
    --bg: #FAF9F5;
    --card: #FFFFFF;
    --ink: #23231F;
    --ink-2: #5F5E58;
    --ink-3: #8A8880;
    --line: #E3E0D8;
    --line-2: #CFCCC2;
    --accent: #6B4FA8;
    --danger: #A33;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1B19;
      --card: #252523;
      --ink: #EDEBE4;
      --ink-2: #B4B1A8;
      --ink-3: #86847D;
      --line: #3A3936;
      --line-2: #4C4B46;
      --accent: #A492DC;
      --danger: #F09595;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

  .cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .panel + .panel { margin-top: 12px; }

  /* Every control has the same shape: [icon or belt chip] [slider] [number]. */
  .field {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 24px;
    gap: 10px; align-items: center;
  }
  .field + .field { margin-top: 10px; }

  .fval { font-size: 12px; color: var(--ink-2); text-align: end; font-variant-numeric: tabular-nums; }

  .ico { display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .ico svg, button svg { display: block; }

  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }

  .chip { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); }

  /* Rank order is shown by the order of the rows themselves; render() sets it. */
  #belts { display: flex; flex-direction: column; }

  .toggles { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .toggles select {
    font: inherit; font-size: 13px;
    margin-inline-start: auto; max-width: 45%; padding: 6px 8px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--radius);
  }

  .icon-toggle { position: relative; display: block; cursor: pointer; }
  .icon-toggle input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
  .icon-toggle span {
    display: block; padding: 7px; color: var(--ink-3);
    border: 1px solid var(--line-2); border-radius: var(--radius);
  }
  .icon-toggle input:checked + span { color: #fff; background: var(--accent); border-color: var(--accent); }
  .icon-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  #stage { overflow: hidden; }
  #stage svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }

  .bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }

  button {
    font: inherit; display: flex; align-items: center; justify-content: center;
    padding: 9px 18px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--radius);
    cursor: pointer; touch-action: manipulation;
  }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .count { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; color: var(--ink-2); }
  .count .ico { color: inherit; }
  .count.warn { color: var(--danger); }
  #status { font-size: 12px; font-variant-numeric: tabular-nums; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /*
    Phones: the app is sized to the viewport so every belt slider is on screen
    without scrolling. The controls keep their natural height and the preview
    takes what is left over, so the preview is what shrinks as belts are added.
  */
  @media (max-width: 860px) {
    .wrap {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 12px;
    }

    /* align-items must be reset: the desktop rule sets `start`, which in a
       flex column shrinks each panel to its content width. */
    .cols {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    }
    .cols > div { flex: 0 0 auto; }        /* controls: natural height */

    .panel { padding: 8px 12px; }
    .panel + .panel { margin-top: 8px; }

    .cols > .panel {                       /* preview: soaks up the remainder */
      order: -1;
      flex: 1 1 0; min-height: 110px;
      display: flex; flex-direction: column;
      padding: 8px;
    }
    #stage { flex: 1 1 auto; min-height: 0; position: relative; }
    /* Absolute, so max-height resolves against a definite box: the drawing
       scales down to fit instead of pushing the controls off screen. */
    #stage svg {
      position: absolute; inset: 0; margin: auto;
      max-width: 100%; max-height: 100%; width: auto; height: auto;
    }

    .field + .field { margin-top: 6px; }
    .toggles { margin-top: 8px; }
    input[type=range] { height: 24px; }    /* larger touch target */
    .bar { margin-top: 8px; }
    button { padding: 7px 18px; }
  }
</style>
</head>

<body>
<div class="wrap">
  <h1 class="sr-only" data-t="title"></h1>

  <div class="cols">
    <div>
      <section class="panel">
        <h2 class="sr-only" data-t="floor"></h2>
        <div class="field">
          <span class="ico" data-icon="rows"></span>
          <input type="range" id="rows" min="1" max="8" value="4" data-t-aria="rows">
          <span class="fval" id="rowsVal"></span>
        </div>
        <div class="field">
          <span class="ico" data-icon="cols"></span>
          <input type="range" id="cols" min="1" max="10" value="4" data-t-aria="cols">
          <span class="fval" id="colsVal"></span>
        </div>
        <div class="toggles">
          <label class="icon-toggle" data-t-title="numbers">
            <input type="checkbox" id="showNums" data-t-aria="numbers">
            <span data-icon="numbers"></span>
          </label>
          <label class="icon-toggle" data-t-title="reverse">
            <input type="checkbox" id="reverse" data-t-aria="reverse">
            <span data-icon="reverse"></span>
          </label>
          <label class="icon-toggle" data-t-title="legend">
            <input type="checkbox" id="showLegend" data-t-aria="legend">
            <span data-icon="legend"></span>
          </label>
          <!-- The one place words are unavoidable: each language names itself. -->
          <select id="lang" data-t-aria="language" data-t-title="language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </section>

      <section class="panel">
        <h2 class="sr-only" data-t="students"></h2>
        <div id="belts"></div>
      </section>
    </div>

    <section class="panel">
      <h2 class="sr-only" data-t="preview"></h2>
      <div id="stage" role="img" data-t-aria="plan"></div>
      <div class="bar">
        <button id="pngBtn" class="primary" data-icon="download"
                data-t-aria="download" data-t-title="download"></button>
        <span class="count" id="count">
          <span class="ico" data-icon="people"></span><span id="status"></span>
        </span>
      </div>
    </section>
  </div>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   1. CONFIG — everything you are likely to want to change lives here.
--------------------------------------------------------------------------- */

/*
  Ranks in order, most senior first. Names are not here — they live in
  STRINGS, keyed by `id`, so each one reads correctly in every language.

  Only green / yellow / white and their mixes are belts. The last two entries
  are the pre-belt stages and are deliberately the most junior: `grey` is a
  student in a club shirt, `purple` a student still in their own clothes.
  Neither is called a belt in any of the translations.

  `base`   fill colour of the circle
  `stripe` colour of the horizontal band, or null for a plain belt
  `ink`    colour of the position number drawn on top
*/
const BELTS = [
  { id: "green",  base: "#2E7D4F", stripe: null,      ink: "#FFFFFF" },
  { id: "yg",     base: "#F0C93C", stripe: "#2E7D4F", ink: "#3B3306" },
  { id: "yellow", base: "#F0C93C", stripe: null,      ink: "#3B3306" },
  { id: "wy",     base: "#FCFBF7", stripe: "#F0C93C", ink: "#3A3A36" },
  { id: "white",  base: "#FCFBF7", stripe: null,      ink: "#3A3A36" },
  { id: "grey",   base: "#777777", stripe: null,      ink: "#FFFFFF" },
  { id: "purple", base: "#6B4FA8", stripe: null,      ink: "#FFFFFF" },
];

const DEFAULT_COUNTS = { green: 3, yg: 1, yellow: 2, wy: 3, white: 3, grey: 2, purple: 2 };

const INSTRUCTOR = { base: "#191917", stripe: null, ink: "#FFFFFF" };

/* Geometry of the infographic, in SVG user units. */
const GEO = {
  radius: 24,          // circle radius
  cell: 68,            // grid pitch; cell - 2*radius is the gap between circles
  minWidth: 320,       // keeps a narrow grid from rendering as a sliver
  pad: 40,             // horizontal padding inside the mat
  stripeFraction: 0.34, // half-height of the stripe, as a fraction of the radius
};

/*
  Legend geometry, used only when the legend is switched on. Its row count and
  column width are derived from the entries themselves, so adding a belt or
  switching to a language with longer names cannot clip it.
*/
const LEGEND = {
  cols: 2,
  swatch: 9,          // radius of the legend circle
  rowHeight: 26,
  gap: 18,            // between the two columns
  fontSize: 12,
  charWidth: 0.6,     // rough glyph advance, as a fraction of fontSize
  textGap: 8,         // swatch to label
  topGap: 20,         // grid to the first legend row
};

/* Fixed palette for the exported image — deliberately does not follow the
   page theme, so a downloaded PNG looks the same for everyone. */
const PAPER = {
  mat: "#F7F5EF",
  matEdge: "#DAD6CB",
  ink: "#3A3934",
  inkMuted: "#6E6C64",
  ring: "#2C2B27",
};

const SVG_FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

/* Slider bounds. Grid bounds must match the `min`/`max` on the inputs. */
const LIMITS = { maxPerBelt: 20, maxRows: 8, maxCols: 10 };

const FILENAME = "taekwondo-lineup";

/* ---------------------------------------------------------------------------
   1b. STRINGS

   The interface is wordless by design, so almost everything below is read
   only by screen readers, tooltips and the optional legend. `belts` is keyed
   by BELTS[].id; `count` builds the per-slider label.

   Note for translators: the seating convention is physical, not textual. The
   most senior student stands front-right in every language, including the
   right-to-left ones — the drawing is never mirrored.
--------------------------------------------------------------------------- */

const LANGS = ["en", "de", "ar"];
const RTL = new Set(["ar"]);

const STRINGS = {
  en: {
    title: "Taekwondo lineup builder",
    floor: "Floor",
    students: "Students",
    preview: "Lineup preview",
    plan: "Overhead plan of the class lined up in rank order, most senior at the front right, each row filling right to left",
    rows: "Rows",
    cols: "Columns",
    numbers: "Show position numbers",
    reverse: "Reverse rank order",
    legend: "Show legend",
    language: "Language",
    download: "Download PNG",
    instructor: "Instructor",
    count: (rank) => `${rank} count`,
    belts: {
      green: "Green belt",
      yg: "Yellow-green belt",
      yellow: "Yellow belt",
      wy: "White-yellow belt",
      white: "White belt",
      grey: "Club shirt",
      purple: "Own clothes",
    },
  },

  de: {
    title: "Taekwondo-Aufstellungsplaner",
    floor: "Trainingsfläche",
    students: "Schüler",
    preview: "Vorschau der Aufstellung",
    plan: "Draufsicht der Klasse in Rangfolge, der ranghöchste Schüler vorne rechts, jede Reihe von rechts nach links gefüllt",
    rows: "Reihen",
    cols: "Spalten",
    numbers: "Positionsnummern anzeigen",
    reverse: "Rangfolge umkehren",
    legend: "Legende anzeigen",
    language: "Sprache",
    download: "PNG herunterladen",
    instructor: "Meister",
    count: (rank) => `Anzahl ${rank}`,
    belts: {
      green: "Grün-Gurt",
      yg: "Gelb-Grün-Gurt",
      yellow: "Gelb-Gurt",
      wy: "Weiß-Gelb-Gurt",
      white: "Weiß-Gurt",
      grey: "Vereinsshirt",
      purple: "Eigene Kleidung",
    },
  },

  ar: {
    title: "مخطط اصطفاف التايكوندو",
    floor: "أرضية التدريب",
    students: "الطلاب",
    preview: "معاينة الاصطفاف",
    plan: "مخطط علوي للصف مرتبًا حسب الرتبة، الأقدم في المقدمة على اليمين، وكل صف يُملأ من اليمين إلى اليسار",
    rows: "الصفوف",
    cols: "الأعمدة",
    numbers: "إظهار أرقام المواقع",
    reverse: "عكس ترتيب الرتب",
    legend: "إظهار مفتاح الألوان",
    language: "اللغة",
    download: "تنزيل بصيغة PNG",
    instructor: "المدرب",
    count: (rank) => `عدد ${rank}`,
    belts: {
      green: "حزام أخضر",
      yg: "حزام أصفر-أخضر",
      yellow: "حزام أصفر",
      wy: "حزام أبيض-أصفر",
      white: "حزام أبيض",
      grey: "قميص النادي",
      purple: "ملابس خاصة",
    },
  },
};

/* ---------------------------------------------------------------------------
   2. State
--------------------------------------------------------------------------- */

const state = {
  counts: { ...DEFAULT_COUNTS },
  rows: 4,
  cols: 4,
  showNumbers: false,
  reversed: false,
  showLegend: false,
  lang: "en",          // replaced by detectLang() at startup
};

/* First matching UI language, else English. */
function detectLang() {
  const tags = navigator.languages || [navigator.language || "en"];
  for (const tag of tags) {
    const base = String(tag).toLowerCase().split("-")[0];
    if (LANGS.includes(base)) return base;
  }
  return "en";
}

const t = () => STRINGS[state.lang] || STRINGS.en;
const isRtl = () => RTL.has(state.lang);

const $ = (id) => document.getElementById(id);
const el = {
  rows: $("rows"), cols: $("cols"),
  rowsVal: $("rowsVal"), colsVal: $("colsVal"),
  showNums: $("showNums"), reverse: $("reverse"),
  showLegend: $("showLegend"), lang: $("lang"),
  belts: $("belts"), stage: $("stage"),
  count: $("count"), status: $("status"), pngBtn: $("pngBtn"),
};

const escapeXml = (s) => String(s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* Belts in the order currently selected. */
const rankedBelts = () => state.reversed ? [...BELTS].reverse() : BELTS;

/* One entry per student, in rank order. */
function roster() {
  const out = [];
  for (const belt of rankedBelts()) {
    for (let i = 0; i < state.counts[belt.id]; i++) out.push(belt);
  }
  return out;
}

const headcount = () => Object.values(state.counts).reduce((a, b) => a + b, 0);

/*
  Choose the squarest grid that holds everyone, within the slider bounds.
  Called whenever a belt count changes; the row/column sliders remain
  editable afterwards, so a manual layout survives until the next change.
*/
function fitGrid() {
  const total = headcount();
  if (total < 1) return;
  let cols = Math.min(LIMITS.maxCols, Math.max(1, Math.ceil(Math.sqrt(total))));
  let rows = Math.min(LIMITS.maxRows, Math.max(1, Math.ceil(total / cols)));
  while (rows * cols < total && cols < LIMITS.maxCols) {
    cols++;
    rows = Math.min(LIMITS.maxRows, Math.ceil(total / cols));
  }
  state.cols = cols;
  state.rows = rows;
  el.cols.value = cols;
  el.rows.value = rows;
}

/*
  Right-origin seat order. Seat 0 is the front-right corner; each row runs
  right to left, then wraps to the right end of the row behind.
  Swap the `col` line for `col = fromEdge` to get the left-origin convention.
*/
function seatPosition(index, cols) {
  const row = Math.floor(index / cols);
  const fromEdge = index % cols;
  const col = cols - 1 - fromEdge;
  return { row, col };
}

/* ---------------------------------------------------------------------------
   3. buildSvg — pure function from state to an SVG string
--------------------------------------------------------------------------- */

/* One belt circle: fill, optional stripe band clipped to the circle,
   outline, and optional position number. */
function circleMarkup(key, cx, cy, r, spec, label) {
  const parts = [];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${spec.base}"/>`);

  if (spec.stripe) {
    const clipId = `clip-${key}`;
    const half = r * GEO.stripeFraction;
    parts.push(`<clipPath id="${clipId}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`);
    parts.push(
      `<rect x="${cx - r}" y="${cy - half}" width="${2 * r}" height="${2 * half}" ` +
      `fill="${spec.stripe}" clip-path="url(#${clipId})"/>`
    );
  }

  parts.push(
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ` +
    `stroke="${PAPER.ring}" stroke-width="1.25" stroke-opacity="0.55"/>`
  );

  if (label) {
    parts.push(
      `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" ` +
      `font-family="${SVG_FONT}" font-size="14" font-weight="500" fill="${spec.ink}">` +
      `${escapeXml(label)}</text>`
    );
  }
  return parts.join("");
}

function buildSvg() {
  const { radius: R, cell, pad } = GEO;
  const { rows, cols } = state;

  const students = roster();
  const capacity = rows * cols;
  const placed = students.slice(0, capacity);

  // --- layout -------------------------------------------------------------
  /*
    The legend is sized from its own contents — longest label, entry count —
    so neither a new belt nor a wordier language can overflow the drawing.
  */
  const legend = state.showLegend
    ? [{ label: t().instructor, spec: INSTRUCTOR },
       ...rankedBelts().map((b) => ({ label: t().belts[b.id], spec: b }))]
    : [];

  const legendColWidth = legend.length
    ? Math.round(LEGEND.swatch * 2 + LEGEND.textGap +
        Math.max(...legend.map((e) => e.label.length)) * LEGEND.fontSize * LEGEND.charWidth)
    : 0;
  const legendWidth = legend.length
    ? LEGEND.cols * legendColWidth + (LEGEND.cols - 1) * LEGEND.gap
    : 0;
  const legendRows = Math.ceil(legend.length / LEGEND.cols);

  const gridWidth = cols * cell;
  const width = Math.max(gridWidth + pad * 2, legendWidth + pad * 2, GEO.minWidth);
  const gridLeft = (width - gridWidth) / 2;

  const instructorCy = 34 + R;
  const frontLineY = instructorCy + R + 22;
  const gridTop = frontLineY + 26;
  const gridBottom = gridTop + rows * cell;

  const legendTop = gridBottom + LEGEND.topGap;
  const height = legend.length
    ? legendTop + legendRows * LEGEND.rowHeight + 12
    : gridBottom + 24;

  // --- draw ---------------------------------------------------------------
  const svg = [];
  svg.push(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" ` +
    `viewBox="0 0 ${width} ${height}">`
  );
  svg.push(
    `<rect x="0" y="0" width="${width}" height="${height}" rx="14" ` +
    `fill="${PAPER.mat}" stroke="${PAPER.matEdge}" stroke-width="1"/>`
  );

  // Instructor and the line marking the front of the room. The dark circle
  // alone stands for the instructor — the drawing carries no words.
  svg.push(circleMarkup("instructor", width / 2, instructorCy, R, INSTRUCTOR, ""));
  svg.push(
    `<line x1="${pad}" y1="${frontLineY}" x2="${width - pad}" y2="${frontLineY}" ` +
    `stroke="${PAPER.matEdge}" stroke-width="1" stroke-dasharray="5 4"/>`
  );

  // Students.
  placed.forEach((belt, i) => {
    const { row, col } = seatPosition(i, cols);
    const cx = gridLeft + col * cell + cell / 2;
    const cy = gridTop + row * cell + cell / 2;
    svg.push(circleMarkup(i, cx, cy, R, belt, state.showNumbers ? String(i + 1) : ""));
  });

  /*
    Legend, two columns. In a right-to-left language the swatch sits on the
    right of its label and the text is end-anchored; the lineup itself is not
    mirrored, because front-right is a physical convention, not a textual one.
  */
  if (legend.length) {
    const rtl = isRtl();
    const legendLeft = (width - legendWidth) / 2;

    legend.forEach((item, i) => {
      // In RTL the first entry belongs in the rightmost column, so the reading
      // order across a row still runs instructor, then belts by rank.
      const slot = i % LEGEND.cols;
      const colIndex = rtl ? LEGEND.cols - 1 - slot : slot;
      const rowIndex = Math.floor(i / LEGEND.cols);
      const colLeft = legendLeft + colIndex * (legendColWidth + LEGEND.gap);
      const cy = legendTop + rowIndex * LEGEND.rowHeight + LEGEND.rowHeight / 2;
      const cx = rtl ? colLeft + legendColWidth - LEGEND.swatch : colLeft + LEGEND.swatch;
      const tx = cx + (rtl ? -1 : 1) * (LEGEND.swatch + LEGEND.textGap);

      svg.push(circleMarkup(`legend-${i}`, cx, cy, LEGEND.swatch, item.spec, ""));
      // text-anchor stays "start" in both directions: with direction="rtl" the
      // start edge is the right-hand one, so the label runs away from the
      // swatch either way. Anchoring "end" would run it back over the swatch.
      svg.push(
        `<text x="${tx}" y="${cy}" text-anchor="start" ` +
        (rtl ? 'direction="rtl" ' : "") +
        `dominant-baseline="central" font-family="${SVG_FONT}" ` +
        `font-size="${LEGEND.fontSize}" fill="${PAPER.ink}">${escapeXml(item.label)}</text>`
      );
    });
  }

  svg.push("</svg>");

  return { markup: svg.join(""), width, height, total: students.length, capacity };
}

/* ---------------------------------------------------------------------------
   4. Render
--------------------------------------------------------------------------- */

function render() {
  const result = buildSvg();
  el.stage.innerHTML = result.markup;

  el.rowsVal.textContent = state.rows;
  el.colsVal.textContent = state.cols;

  // The belt list is reordered rather than labelled: its top-to-bottom order
  // is the rank order, and so follows the "reverse" toggle.
  rankedBelts().forEach((belt, i) => {
    const row = el.belts.querySelector(`[data-belt="${belt.id}"]`);
    if (row) row.style.order = i;
  });

  // headcount / places, red when the floor cannot hold everyone.
  el.count.className = result.total > result.capacity ? "count warn" : "count";
  el.status.textContent = `${result.total} / ${result.capacity}`;
}

/* ---------------------------------------------------------------------------
   5. Controls
--------------------------------------------------------------------------- */

/*
  Inline 16px icons, stroked in currentColor so they follow the theme and the
  checked state of a toggle. Injected into every [data-icon] element.
*/
const ICONS = {
  rows: '<path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>',
  cols: '<path d="M4 2.5v11M8 2.5v11M12 2.5v11"/>',
  reverse: '<path d="M5 13.5V3M5 3L2.6 5.4M5 3l2.4 2.4M11 2.5V13M11 13l2.4-2.4M11 13l-2.4-2.4"/>',
  numbers: '<circle cx="8" cy="8" r="5.7"/><path d="M6.9 6.5L8.2 5.6v4.9M6.9 10.5h2.6"/>',
  people: '<circle cx="8" cy="5.2" r="2.5"/><path d="M3 13.6a5 5 0 0 1 10 0"/>',
  legend: '<circle cx="3.6" cy="4.6" r="1.9"/><path d="M8 4.6h5.6"/>' +
          '<circle cx="3.6" cy="11.4" r="1.9"/><path d="M8 11.4h5.6"/>',
  download: '<path d="M8 2.5v7.5M8 10l3-3M8 10L5 7M2.8 13h10.4"/>',
  check: '<path d="M3.2 8.4l3.4 3.4 6.2-7"/>',
  warn: '<path d="M8 2.6l6.2 10.8H1.8z"/><path d="M8 6.8v3M8 11.9v.4"/>',
};

const iconSvg = (name) =>
  `<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" ` +
  `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

function paintIcons(root) {
  root.querySelectorAll("[data-icon]").forEach((node) => {
    node.innerHTML = iconSvg(node.dataset.icon);
  });
}

/* Swap the download button's icon briefly to signal the outcome of a save. */
let flashTimer = null;
function flashIcon(name) {
  el.pngBtn.innerHTML = iconSvg(name);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.pngBtn.innerHTML = iconSvg("download"); }, 1600);
}

function buildBeltControls() {
  el.belts.innerHTML = "";

  for (const belt of BELTS) {
    const row = document.createElement("div");
    row.className = "field";
    row.dataset.belt = belt.id;     // the colour is the label; applyBeltStrings
                                    // fills in title / aria-label per language

    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.background = belt.stripe
      ? `linear-gradient(${belt.base} 0 34%, ${belt.stripe} 34% 66%, ${belt.base} 66% 100%)`
      : belt.base;

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = String(LIMITS.maxPerBelt);
    slider.value = state.counts[belt.id];

    const valueOut = document.createElement("span");
    valueOut.className = "fval";
    valueOut.textContent = state.counts[belt.id];

    slider.addEventListener("input", () => {
      state.counts[belt.id] = Number(slider.value);
      valueOut.textContent = slider.value;
      fitGrid();
      render();
    });

    row.append(chip, slider, valueOut);
    el.belts.append(row);
  }
}

/* Static labels are addressed by key: data-t (text), -aria, -title. */
function applyStrings(root) {
  const s = t();
  root.querySelectorAll("[data-t]").forEach((n) => { n.textContent = s[n.dataset.t]; });
  root.querySelectorAll("[data-t-aria]").forEach((n) => {
    n.setAttribute("aria-label", s[n.dataset.tAria]);
  });
  root.querySelectorAll("[data-t-title]").forEach((n) => { n.title = s[n.dataset.tTitle]; });
}

/* The generated belt rows carry no text, only a name for tooltip and reader. */
function applyBeltStrings() {
  const s = t();
  el.belts.querySelectorAll("[data-belt]").forEach((row) => {
    const name = s.belts[row.dataset.belt];
    row.title = name;
    row.querySelector("input").setAttribute("aria-label", s.count(name));
  });
}

/*
  Switching language also switches document direction, which mirrors the
  controls. It deliberately does not mirror the lineup: front-right is where
  the senior student physically stands, in every language.
*/
function applyLanguage(lang) {
  state.lang = LANGS.includes(lang) ? lang : "en";
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isRtl() ? "rtl" : "ltr";
  document.title = t().title;
  el.lang.value = state.lang;
  applyStrings(document);
  applyBeltStrings();
  render();
}

el.rows.addEventListener("input", () => { state.rows = Number(el.rows.value); render(); });
el.cols.addEventListener("input", () => { state.cols = Number(el.cols.value); render(); });
el.showNums.addEventListener("change", () => { state.showNumbers = el.showNums.checked; render(); });
el.reverse.addEventListener("change", () => { state.reversed = el.reverse.checked; render(); });
el.showLegend.addEventListener("change", () => { state.showLegend = el.showLegend.checked; render(); });
el.lang.addEventListener("change", () => applyLanguage(el.lang.value));

/* ---------------------------------------------------------------------------
   6. Export

   Two paths. Inside the Claude artifact runtime the file goes through
   claude.use("downloads"); everywhere else — a local file, your own site —
   it falls back to an object URL and a synthetic click.

   buildSvg() still backs this: the SVG is rasterised to PNG rather than
   offered as its own download.
--------------------------------------------------------------------------- */

let claudeDownloads = null;

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads")
    .then((api) => { claudeDownloads = api; })
    .catch(() => {});
}

function saveFile(filename, blob) {
  if (claudeDownloads) {
    claudeDownloads.save({ filename, data: blob })
      .then(() => flashIcon("check"))
      .catch((err) => {
        if (err && err.code === "declined") return;
        el.pngBtn.title = `Could not save: ${(err && err.code) || "unknown error"}`;
        flashIcon("warn");
      });
    return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flashIcon("check");
}

/* Rasterise by loading the SVG as a data URL into an <img>. The SVG has no
   external references, so the canvas stays untainted and toBlob works. */
el.pngBtn.addEventListener("click", () => {
  const { markup, width, height } = buildSvg();
  const scale = 2;

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = PAPER.mat;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      if (!blob) return flashIcon("warn");
      saveFile(`${FILENAME}.png`, blob);
    }, "image/png");
  };
  img.onerror = () => flashIcon("warn");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
});

/* ---------------------------------------------------------------------------
   7. Start
--------------------------------------------------------------------------- */

paintIcons(document);
buildBeltControls();
fitGrid();
applyLanguage(detectLang());   // also renders
</script>
</body>
</html>
